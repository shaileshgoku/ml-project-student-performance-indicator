[project]
name = "student-performance-indicator"
version = "0.1.0"
description = "Student performance prediction app for Streamlit Cloud deployment"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "catboost",
    "dill",
    "flask",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "streamlit",
    "xgboost",
]

[tool.uv]
package = true
